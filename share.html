<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Yuk Nonton — CLEO WATCH</title>
<meta name="theme-color" content="#07070E">
<link rel="stylesheet" href="/css/cleowatch.css">
<style>
body{background:var(--bg)}
.share-wrap{
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:32px 20px;text-align:center;gap:0;
  background:
    radial-gradient(ellipse 60% 50% at 50% 0%, rgba(200,200,208,.06) 0%, transparent 70%),
    var(--bg);
}
.share-logo{margin-bottom:28px}
.share-poster-wrap{
  position:relative;width:140px;margin-bottom:24px;
}
.share-poster-wrap::before{
  content:'';position:absolute;inset:-8px;border-radius:calc(var(--r-lg) + 8px);
  background:linear-gradient(135deg,var(--silver-l),var(--silver-d));
  opacity:.15;filter:blur(12px);
}
.share-poster{
  width:140px;border-radius:var(--r-lg);overflow:hidden;
  border:2px solid rgba(200,200,208,.2);
  box-shadow:0 20px 60px rgba(0,0,0,.8);
  position:relative;
}
.share-poster img{width:100%;display:block}
.share-poster-ph{
  aspect-ratio:2/3;width:100%;background:var(--bg-2);
  display:flex;align-items:center;justify-content:center;
}
.share-cta{
  font-size:clamp(20px,5vw,28px);font-weight:900;
  line-height:1.2;margin-bottom:10px;
  color:var(--text);
}
.share-cta span{
  background:linear-gradient(135deg,var(--silver-l),var(--silver-d));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.share-sub{
  font-size:14px;color:var(--text-m);max-width:300px;
  line-height:1.6;margin-bottom:28px;
}
.share-film-title{
  font-size:17px;font-weight:700;color:var(--text);
  margin-bottom:6px;
}
.share-film-meta{font-size:12px;color:var(--text-d);margin-bottom:20px}

.share-btns{display:flex;flex-direction:column;gap:10px;width:100%;max-width:280px}
.share-watch-btn{
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding:14px 24px;border-radius:var(--r-xl);
  background:linear-gradient(135deg,var(--silver-l) 0%,var(--silver) 50%,var(--silver-d) 100%);
  color:var(--bg);font-size:15px;font-weight:800;
  text-decoration:none;
  box-shadow:0 6px 24px rgba(200,200,208,.2);
  transition:opacity .2s,transform .2s;
}
.share-watch-btn:hover{opacity:.9;transform:translateY(-2px)}
.share-copy-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:12px 20px;border-radius:var(--r-xl);
  background:rgba(255,255,255,.06);border:1px solid var(--border-h);
  color:var(--text-m);font-size:13px;font-weight:600;cursor:pointer;
  transition:all .2s;
}
.share-copy-btn:hover{background:rgba(255,255,255,.1)}

.share-powered{
  margin-top:32px;
  font-size:11px;color:var(--text-d);
  display:flex;align-items:center;gap:6px;
}
</style>
</head>
<body>
<div class="share-wrap">
  <!-- Logo -->
  <div class="share-logo" id="logoRoot"></div>

  <!-- Poster -->
  <div class="share-poster-wrap">
    <div class="share-poster" id="sharePoster">
      <div class="share-poster-ph">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".3">
          <rect x="2" y="7" width="20" height="15" rx="2"/><polyline points="17 2 12 7 7 2"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- CTA Text -->
  <div class="share-cta">Yuk nonton<br><span id="shareTitleEl">ini</span> bareng!</div>
  <div class="share-sub" id="shareSubEl">Diajak nonton oleh seseorang. Klik tombol di bawah dan mulai sekarang — gratis!</div>

  <!-- Buttons -->
  <div class="share-btns">
    <a class="share-watch-btn" id="shareWatchBtn" href="/home">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
      Tonton Sekarang
    </a>
    <button class="share-copy-btn" id="shareCopyBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
      Salin Link
    </button>
  </div>

  <div class="share-powered">
    Dibagikan via
    <svg width="14" height="14" viewBox="0 0 48 48" fill="none"><circle cx="24" cy="24" r="22" stroke="#C8C8D0" stroke-width="1.5" fill="none" opacity=".5"/><path d="M15 32V16L24 28V16" stroke="#C8C8D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M24 28L33 16V32" stroke="#C8C8D0" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><circle cx="24" cy="24" r="2" fill="#C8C8D0"/></svg>
    <span style="color:var(--silver)">CLEO WATCH</span>
  </div>
</div>

<script src="/js/cleowatch.js"></script>
<script>
// Logo (no navbar on share page — clean)
document.getElementById('logoRoot').innerHTML = `<a class="nw-logo-wrap" href="/home" style="justify-content:center">${`<svg class="nw-logo-svg" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs><linearGradient id="sg2" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse"><stop offset="0%" stop-color="#E8E8F0"/><stop offset="50%" stop-color="#C8C8D0"/><stop offset="100%" stop-color="#8A8A98"/></linearGradient></defs>
  <circle cx="24" cy="24" r="22" stroke="url(#sg2)" stroke-width="1.5" fill="none" opacity=".5"/>
  <line x1="24" y1="3.5" x2="24" y2="7" stroke="url(#sg2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="24" y1="41" x2="24" y2="44.5" stroke="url(#sg2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="3.5" y1="24" x2="7" y2="24" stroke="url(#sg2)" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="41" y1="24" x2="44.5" y2="24" stroke="url(#sg2)" stroke-width="1.5" stroke-linecap="round"/>
  <path d="M15 32V16L24 28V16" stroke="url(#sg2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M24 28L33 16V32" stroke="url(#sg2)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="24" cy="24" r="2" fill="url(#sg2)"/>
</svg>`}<span class="nw-logo-text">CLEO WATCH</span></a>`;

const p     = new URLSearchParams(location.search);
const id    = p.get('id');
const type  = p.get('type');
const title = decodeURIComponent(p.get('title') || 'Film Ini');

document.title = `Yuk nonton ${title} — CLEO WATCH`;
document.getElementById('shareTitleEl').textContent = title;

const playerUrl = `/player?id=${id}&type=${type}&title=${encodeURIComponent(title)}`;
document.getElementById('shareWatchBtn').href = playerUrl;

// Copy btn
document.getElementById('shareCopyBtn').addEventListener('click', () => {
  navigator.clipboard.writeText(location.href).then(() => nwToast('Link disalin!'));
});

// Load poster
async function loadPoster() {
  if (!id) return;
  try {
    const d = await fetch(`/api/detail?id=${id}&type=${type === 'series' ? 'tv' : 'movie'}`).then(r => r.json());
    if (d.poster) {
      document.getElementById('sharePoster').innerHTML = `<img src="${esc(d.poster)}" alt="${esc(title)}" referrerpolicy="no-referrer">`;
    }
    if (d.year || d.rating) {
      document.getElementById('shareSubEl').textContent =
        `${d.year ? d.year + ' · ' : ''}${d.rating ? '★ ' + d.rating + ' · ' : ''}Gratis, langsung tonton sekarang!`;
    }
  } catch (_) {}
}
loadPoster();
</script>
</body>
</html>
