<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>CLEO WATCH — Nonton Film & Series Premium</title>
<meta name="theme-color" content="#07070E">
<link rel="stylesheet" href="/css/cleowatch.css">
<style>
/* Grid 2 kolom fix */
.content-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
}
@media(min-width:480px){ .content-grid{grid-template-columns:repeat(3,1fr);gap:12px} }
@media(min-width:768px){ .content-grid{grid-template-columns:repeat(4,1fr);gap:14px} }
@media(min-width:1024px){ .content-grid{grid-template-columns:repeat(5,1fr);gap:16px} }
@media(min-width:1280px){ .content-grid{grid-template-columns:repeat(6,1fr);gap:16px} }

/* Card in grid - override flex-shrink */
.content-grid .card{ flex-shrink:unset; width:100%; }

/* Genre chips */
.genre-wrap{
  display:flex;gap:7px;overflow-x:auto;
  padding:0 14px 2px;scrollbar-width:none;
  margin-bottom:16px;
}
.genre-wrap::-webkit-scrollbar{display:none}
.genre-chip{
  flex-shrink:0;padding:6px 14px;border-radius:100px;
  font-size:12px;font-weight:600;color:var(--text-m);
  background:var(--bg-card);border:1px solid var(--border);
  cursor:pointer;transition:all var(--t);white-space:nowrap;
}
.genre-chip:hover{ color:var(--text); border-color:var(--border-h); }
.genre-chip.active{
  background:rgba(200,200,208,.14);border-color:var(--silver-d);
  color:var(--silver-l);
}

/* Tab row untuk kategori utama */
.cat-tabs{
  display:flex;gap:0;border-bottom:1px solid var(--border);
  margin-bottom:20px;overflow-x:auto;scrollbar-width:none;
}
.cat-tabs::-webkit-scrollbar{display:none}
.cat-tab{
  padding:10px 18px;font-size:13px;font-weight:600;
  color:var(--text-d);background:none;border:none;
  border-bottom:2px solid transparent;margin-bottom:-1px;
  cursor:pointer;white-space:nowrap;transition:all var(--t);
}
.cat-tab:hover{ color:var(--text-m); }
.cat-tab.active{ color:var(--silver-l); border-bottom-color:var(--silver); }

/* Load more */
.load-more-wrap{ display:flex;justify-content:center;padding:24px 0 }
.load-more-btn{
  padding:10px 28px;border-radius:100px;
  background:var(--bg-card);border:1px solid var(--border-h);
  color:var(--text-m);font-size:13px;font-weight:600;
  cursor:pointer;transition:all var(--t);
}
.load-more-btn:hover{ border-color:var(--silver-d);color:var(--silver-l); }

/* Search bar besar di bawah hero */
.home-search-wrap{
  padding:16px 14px 0;max-width:1440px;margin:0 auto;
}
.home-search-bar{
  display:flex;align-items:center;gap:10px;
  background:var(--bg-1);border:1px solid var(--border);
  border-radius:var(--r-xl);padding:0 16px;height:44px;
  transition:border-color var(--t);
}
.home-search-bar:focus-within{ border-color:var(--border-h); }
.home-search-bar input{
  flex:1;background:none;border:none;outline:none;
  color:var(--text);font-size:14px;
}
.home-search-bar input::placeholder{ color:var(--text-d); }
.home-search-bar button{
  background:none;border:none;cursor:pointer;
  color:var(--text-d);display:flex;align-items:center;
  transition:color var(--t);padding:0;
}
.home-search-bar button:hover{ color:var(--silver); }
</style>
</head>
<body>
<div id="nav-root"></div>

<div class="page">
  <!-- Hero Banner -->
  <div class="hero-banner" id="heroBanner">
    <div class="hero-bg" id="heroBg"></div>
    <div class="hero-grad"></div>
    <div class="hero-content" id="heroContent">
      <div class="skel" style="height:18px;width:100px;border-radius:100px;margin-bottom:12px"></div>
      <div class="skel" style="height:28px;width:240px;margin-bottom:8px"></div>
      <div class="skel" style="height:13px;width:300px;margin-bottom:18px"></div>
      <div style="display:flex;gap:8px">
        <div class="skel" style="height:40px;width:120px;border-radius:100px"></div>
        <div class="skel" style="height:40px;width:100px;border-radius:100px"></div>
      </div>
    </div>
    <div class="hero-dots" id="heroDots"></div>
  </div>

  <!-- Search bar -->
  <div class="home-search-wrap">
    <div class="home-search-bar">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" color="var(--text-d)">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="homeSearchInput" type="text" placeholder="Cari film atau series…" autocomplete="off"/>
      <button id="homeSearchBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Main content -->
  <div class="section">
    <div class="section-inner">

      <!-- Kategori tabs -->
      <div class="cat-tabs" id="catTabs">
        <button class="cat-tab active" data-cat="trending_movies">Film Trending</button>
        <button class="cat-tab" data-cat="trending_series">Series Trending</button>
        <button class="cat-tab" data-cat="top_movies">Film Terbaik</button>
        <button class="cat-tab" data-cat="top_series">Series Terbaik</button>
        <button class="cat-tab" data-cat="upcoming">Segera Tayang</button>
        <button class="cat-tab" data-cat="search">Pencarian</button>
      </div>

      <!-- Genre filter -->
      <div class="genre-wrap" id="genreWrap" style="display:none"></div>

      <!-- Grid -->
      <div class="content-grid" id="mainGrid">
        <!-- skeleton -->
        ${Array.from({length:10},()=>`
          <div class="card">
            <div class="card-thumb skel" style="aspect-ratio:2/3"></div>
            <div class="card-info">
              <div class="skel" style="height:11px;width:80%;margin-bottom:6px"></div>
              <div class="skel" style="height:10px;width:50%"></div>
            </div>
          </div>`).join('')}
      </div>

      <!-- Load more -->
      <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
        <button class="load-more-btn" id="loadMoreBtn">Muat Lebih Banyak</button>
      </div>

    </div>
  </div>

  <div id="footer-root"></div>
</div>

<script src="/js/cleowatch.js"></script>
<script>
document.getElementById('nav-root').innerHTML = cleoNavbar();
document.getElementById('footer-root').innerHTML = nwFooter();
cleoInitNav();

// Genre map TMDB
const GENRES_MOVIE = [
  {id:28,name:'Aksi'},{id:12,name:'Petualangan'},{id:16,name:'Animasi'},
  {id:35,name:'Komedi'},{id:80,name:'Kriminal'},{id:18,name:'Drama'},
  {id:14,name:'Fantasi'},{id:27,name:'Horor'},{id:9648,name:'Misteri'},
  {id:10749,name:'Romantis'},{id:878,name:'Sci-Fi'},{id:53,name:'Thriller'},
];
const GENRES_TV = [
  {id:16,name:'Animasi'},{id:35,name:'Komedi'},{id:18,name:'Drama'},
  {id:10765,name:'Sci-Fi & Fantasi'},{id:80,name:'Kriminal'},
  {id:9648,name:'Misteri'},{id:10759,name:'Aksi & Petualangan'},
  {id:10768,name:'Perang & Politik'},{id:10764,name:'Reality'},
];

let homeData   = null;
let curCat     = 'trending_movies';
let curGenre   = null;
let curSearch  = '';
let heroItems  = [];
let heroCur    = 0;
let heroTimer;

// Skeleton init
const grid = document.getElementById('mainGrid');
grid.innerHTML = Array.from({length:10},()=>`
  <div class="card">
    <div class="card-thumb skel" style="aspect-ratio:2/3"></div>
    <div class="card-info">
      <div class="skel" style="height:11px;width:80%;margin-bottom:6px"></div>
      <div class="skel" style="height:10px;width:50%"></div>
    </div>
  </div>`).join('');

// ── Hero ──────────────────────────────────────────────────────
function setHero(item) {
  document.getElementById('heroBg').style.backgroundImage =
    item.backdrop ? `url('${item.backdrop}')` : 'none';
  const playerUrl = `/player?id=${item.id}&type=${item.type==='tv'?'series':'movie'}&title=${encodeURIComponent(item.title)}`;
  const detailUrl = `/details?id=${item.id}&type=${item.type==='tv'?'series':'movie'}`;
  document.getElementById('heroContent').innerHTML = `
    <div class="hero-badge"><span class="hero-badge-dot"></span>${item.type==='tv'?'SERIES':'FILM'} · ${item.year||''}</div>
    <div class="hero-title">${esc(item.title)}</div>
    <div class="hero-meta">
      ${item.rating?`<div class="hero-rating">★ ${item.rating}</div>`:''}
    </div>
    <div class="hero-overview">${esc(item.overview||'')}</div>
    <div class="hero-actions">
      <a class="btn-primary" href="${playerUrl}">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
        Tonton Sekarang
      </a>
      <a class="btn-secondary" href="${detailUrl}">Detail</a>
    </div>`;
}
function setDots(n,a){
  const el=document.getElementById('heroDots');
  el.innerHTML=Array.from({length:n},(_,i)=>`<button class="hero-dot ${i===a?'active':''}" data-i="${i}"></button>`).join('');
  el.querySelectorAll('.hero-dot').forEach(b=>b.addEventListener('click',()=>{
    clearInterval(heroTimer);heroCur=+b.dataset.i;
    setHero(heroItems[heroCur]);setDots(n,heroCur);
    heroTimer=setInterval(advHero,6000);
  }));
}
function advHero(){ heroCur=(heroCur+1)%heroItems.length; setHero(heroItems[heroCur]); setDots(heroItems.length,heroCur); }

// ── Render grid ───────────────────────────────────────────────
function renderGrid(items) {
  if (!items?.length) {
    grid.innerHTML = `<div class="state-box" style="grid-column:1/-1">
      <svg class="state-icon" width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><circle cx="12" cy="12" r="10"/><path d="M8 15s1.5-2 4-2 4 2 4 2"/><line x1="9" y1="9" x2="9.01" y2="9"/><line x1="15" y1="9" x2="15.01" y2="9"/></svg>
      <div class="state-title">Tidak ada konten</div>
    </div>`;
    return;
  }
  grid.innerHTML = items.map(cardHTML).join('');
}

// ── Genre filter ──────────────────────────────────────────────
function showGenres(cat) {
  const wrap = document.getElementById('genreWrap');
  const isTv = cat === 'trending_series' || cat === 'top_series';
  const genres = isTv ? GENRES_TV : GENRES_MOVIE;
  const isSearch = cat === 'search';
  if (isSearch || cat === 'upcoming') { wrap.style.display='none'; curGenre=null; return; }
  wrap.style.display = 'flex';
  wrap.innerHTML = `<button class="genre-chip active" data-gid="">Semua</button>` +
    genres.map(g=>`<button class="genre-chip" data-gid="${g.id}">${esc(g.name)}</button>`).join('');
  wrap.querySelectorAll('.genre-chip').forEach(btn => btn.addEventListener('click', () => {
    wrap.querySelectorAll('.genre-chip').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    curGenre = btn.dataset.gid ? +btn.dataset.gid : null;
    applyFilter();
  }));
}

function applyFilter() {
  if (!homeData) return;
  let items = homeData[curCat] || [];
  if (curGenre) items = items.filter(i => (i.genres||[]).includes(curGenre));
  renderGrid(items);
}

// ── Category switch ───────────────────────────────────────────
document.querySelectorAll('.cat-tab').forEach(btn => btn.addEventListener('click', () => {
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  curCat = btn.dataset.cat;
  curGenre = null;
  if (curCat === 'search') {
    document.getElementById('genreWrap').style.display='none';
    const q = document.getElementById('homeSearchInput').value.trim();
    if (q) doSearch(q); else renderGrid([]);
    return;
  }
  showGenres(curCat);
  if (homeData) applyFilter();
  else { grid.innerHTML = skeletonCards(10); loadHome(); }
}));

// ── Search ────────────────────────────────────────────────────
function doSearch(q) {
  curSearch = q;
  grid.innerHTML = skeletonCards(10);
  fetch(`/api/search?q=${encodeURIComponent(q)}`)
    .then(r=>r.json())
    .then(data=>renderGrid(data.results||[]))
    .catch(()=>renderGrid([]));
}

document.getElementById('homeSearchBtn').addEventListener('click', () => {
  const q = document.getElementById('homeSearchInput').value.trim();
  if (!q) return;
  // Switch ke tab search
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-cat="search"]').classList.add('active');
  curCat = 'search';
  document.getElementById('genreWrap').style.display='none';
  doSearch(q);
});
document.getElementById('homeSearchInput').addEventListener('keydown', e => {
  if (e.key==='Enter') document.getElementById('homeSearchBtn').click();
});

// Sync dengan nav search
setTimeout(()=>{
  const ni = document.getElementById('navSearchInput');
  const mi = document.getElementById('mobSearchInput');
  if (ni) ni.addEventListener('keydown', e=>{
    if(e.key==='Enter'&&ni.value.trim()){
      document.getElementById('homeSearchInput').value=ni.value;
      document.getElementById('homeSearchBtn').click();
    }
  });
  if (mi) mi.addEventListener('keydown', e=>{
    if(e.key==='Enter'&&mi.value.trim()){
      document.getElementById('homeSearchInput').value=mi.value;
      document.getElementById('homeSearchBtn').click();
    }
  });
},100);

// ── Load home data ────────────────────────────────────────────
async function loadHome() {
  try {
    homeData = await fetch('/api/home').then(r=>r.json());
    // Hero
    heroItems = [...(homeData.trending_movies||[]).slice(0,4), ...(homeData.trending_series||[]).slice(0,3)]
      .filter(i=>i.backdrop).slice(0,7);
    if (heroItems.length) {
      setHero(heroItems[0]); setDots(heroItems.length,0);
      heroTimer = setInterval(advHero, 6000);
    }
    showGenres(curCat);
    applyFilter();
  } catch(e) {
    grid.innerHTML=`<div class="state-box" style="grid-column:1/-1"><div class="state-title">Gagal memuat</div></div>`;
  }
}

// Check URL param
const urlQ = new URLSearchParams(location.search).get('q');
if (urlQ) {
  document.getElementById('homeSearchInput').value = urlQ;
  document.querySelectorAll('.cat-tab').forEach(b=>b.classList.remove('active'));
  document.querySelector('[data-cat="search"]').classList.add('active');
  curCat = 'search';
  doSearch(urlQ);
} else {
  loadHome();
}
</script>
</body>
</html>
