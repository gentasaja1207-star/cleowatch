<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Nonton — CLEO WATCH</title>
<meta name="theme-color" content="#07070E">
<link rel="stylesheet" href="/css/cleowatch.css">
<style>
body{background:#000}
.player-wrap{padding-top:var(--nav-h);background:#000;min-height:100vh}
.player-frame-wrap{
  width:100%;
  height:calc(100vh - var(--nav-h) - 110px);
  min-height:220px;
  background:#000;
}
.player-frame{width:100%;height:100%;border:none;display:block}
.player-info{
  padding:16px 20px 32px;max-width:1440px;margin:0 auto;
  display:flex;align-items:flex-start;gap:16px;flex-wrap:wrap;
}
.player-title{font-size:17px;font-weight:700;margin-bottom:4px}
.player-sub{font-size:12.5px;color:var(--text-d)}
.player-actions{margin-left:auto;display:flex;gap:8px;flex-shrink:0}
</style>
</head>
<body>
<div id="nav-root"></div>
<div class="player-wrap">
  <div class="player-frame-wrap">
    <iframe
      id="playerFrame"
      class="player-frame"
      allowfullscreen
      allow="autoplay; fullscreen; encrypted-media"
      referrerpolicy="no-referrer"
      sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-presentation"
    ></iframe>
  </div>
  <div class="player-info">
    <div>
      <div class="player-title" id="playerTitle">Memuat…</div>
      <div class="player-sub" id="playerSub"></div>
    </div>
    <div class="player-actions" id="playerActions"></div>
  </div>
</div>

<script src="/js/cleowatch.js"></script>
<script>
document.getElementById('nav-root').innerHTML = cleoNavbar();
cleoInitNav();

const p = new URLSearchParams(location.search);
const id      = p.get('id');
const type    = p.get('type');   // movie | series
const title   = p.get('title') || 'Nonton';
const season  = p.get('season')  || '1';
const episode = p.get('episode') || '1';

document.title = `${title} — CLEO WATCH`;
document.getElementById('playerTitle').textContent = decodeURIComponent(title);

let src;
if (type === 'series') {
  src = `https://vidsrc.sbs/embed/tv/${id}/${season}/${episode}`;
  document.getElementById('playerSub').textContent = `Season ${season} · Episode ${episode}`;
} else {
  src = `https://vidsrc.sbs/embed/movie/${id}`;
}

document.getElementById('playerFrame').src = src;

const detailUrl = `/details?id=${id}&type=${type}`;
const shareUrl  = `/share?id=${id}&type=${type}&title=${encodeURIComponent(title)}`;

document.getElementById('playerActions').innerHTML = `
  <a class="btn-secondary" href="${detailUrl}" style="font-size:12px;padding:8px 16px">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    Detail
  </a>
  <button class="btn-secondary" onclick="doShare()" style="font-size:12px;padding:8px 16px">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
    Bagikan
  </button>`;

function doShare() {
  const shareLink = location.origin + shareUrl;
  if (navigator.share) {
    navigator.share({ title: decodeURIComponent(title), url: shareLink }).catch(() => {});
  } else {
    navigator.clipboard.writeText(shareLink).then(() => nwToast('Link disalin!'));
  }
}
</script>
</body>
</html>
