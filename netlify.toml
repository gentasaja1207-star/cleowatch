[build]
  publish = "public"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/home"
  to = "/.netlify/functions/home"
  status = 200

[[redirects]]
  from = "/api/search"
  to = "/.netlify/functions/search"
  status = 200

[[redirects]]
  from = "/api/detail"
  to = "/.netlify/functions/detail"
  status = 200

[[redirects]]
  from = "/home"
  to = "/home.html"
  status = 200

[[redirects]]
  from = "/details"
  to = "/details.html"
  status = 200

[[redirects]]
  from = "/player"
  to = "/player.html"
  status = 200

[[redirects]]
  from = "/share"
  to = "/share.html"
  status = 200

[[redirects]]
  from = "/"
  to = "/home.html"
  status = 200
