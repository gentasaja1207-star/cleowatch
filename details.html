<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Detail — CLEO WATCH</title>
<meta name="theme-color" content="#07070E">
<link rel="stylesheet" href="/css/cleowatch.css">
</head>
<body>
<div id="nav-root"></div>

<div class="page">
  <!-- Hero -->
  <div class="detail-hero" id="detailHero">
    <div class="detail-hero-bg" id="detailBg"></div>
    <div class="detail-hero-grad"></div>
    <div class="detail-hero-content">
      <div class="detail-poster" id="detailPoster">
        <div class="skel" style="aspect-ratio:2/3;width:100%"></div>
      </div>
      <div class="detail-meta" id="detailMeta">
        <div class="skel" style="height:26px;width:220px;margin-bottom:10px"></div>
        <div class="skel" style="height:13px;width:160px;margin-bottom:10px"></div>
        <div class="skel" style="height:13px;width:280px;margin-bottom:14px"></div>
        <div style="display:flex;gap:8px">
          <div class="skel" style="height:40px;width:130px;border-radius:100px"></div>
          <div class="skel" style="height:40px;width:110px;border-radius:100px"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Body -->
  <div class="detail-body" id="detailBody">
    <div class="skel" style="height:14px;width:100%;max-width:600px;margin-bottom:8px"></div>
    <div class="skel" style="height:14px;width:80%;max-width:400px;margin-bottom:32px"></div>
    <div class="skel" style="height:70px;width:100%;margin-bottom:24px;border-radius:12px"></div>
  </div>
</div>

<script src="/js/cleowatch.js"></script>
<script>
document.getElementById('nav-root').innerHTML = cleoNavbar();
cleoInitNav();

const params = new URLSearchParams(location.search);
const id   = params.get('id');
const type = params.get('type'); // 'movie' | 'series'
const apiType = type === 'series' ? 'tv' : 'movie';

let detail = null;
let curSeason = 1;

async function load() {
  if (!id) { renderError('Parameter tidak valid'); return; }
  try {
    detail = await fetch(`/api/detail?id=${id}&type=${apiType}`).then(r => r.json());
    if (detail.error) throw new Error(detail.error);
    document.title = `${detail.title} — CLEO WATCH`;
    renderHero(detail);
    renderBody(detail);
  } catch (e) {
    renderError(e.message);
  }
}

function renderError(msg) {
  document.getElementById('detailBody').innerHTML = `
    <div class="state-box">
      <svg class="state-icon" width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
      <div class="state-title">Gagal memuat</div>
      <div class="state-msg">${esc(msg)}</div>
    </div>`;
}

function renderHero(d) {
  const bg = document.getElementById('detailBg');
  if (d.backdrop) bg.style.backgroundImage = `url('${d.backdrop}')`;

  const playerUrl = `/player?id=${d.id}&type=${type}&title=${encodeURIComponent(d.title)}`;
  const shareUrl  = `/share?id=${d.id}&type=${type}&title=${encodeURIComponent(d.title)}`;

  document.getElementById('detailPoster').innerHTML = d.poster
    ? `<img src="${esc(d.poster)}" alt="${esc(d.title)}" referrerpolicy="no-referrer">`
    : `<div style="aspect-ratio:2/3;background:var(--bg-2);display:flex;align-items:center;justify-content:center"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><rect x="2" y="2" width="20" height="20" rx="3"/></svg></div>`;

  document.getElementById('detailMeta').innerHTML = `
    <div class="detail-title">${esc(d.title)}</div>
    <div class="detail-sub">
      ${d.year ? `<span class="detail-tag">${esc(d.year)}</span>` : ''}
      ${d.status ? `<span class="detail-tag">${esc(d.status)}</span>` : ''}
      ${apiType === 'tv' && d.seasons_count ? `<span class="detail-tag">${d.seasons_count} Season</span>` : ''}
      ${apiType === 'movie' && d.runtime ? `<span class="detail-tag">${d.runtime} mnt</span>` : ''}
      ${d.rating ? `<div class="detail-rating">★ ${d.rating}</div>` : ''}
    </div>
    ${d.genres?.length ? `<div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${d.genres.map(g=>`<span class="detail-tag" style="font-size:11px">${esc(g)}</span>`).join('')}</div>` : ''}
    <div class="detail-actions">
      <a class="btn-primary" href="${playerUrl}">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
        ${apiType === 'tv' ? 'Tonton S1 E1' : 'Tonton Sekarang'}
      </a>
      <button class="btn-secondary" onclick="doShare('${shareUrl}')">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
        Bagikan
      </button>
    </div>`;
}

function renderBody(d) {
  let html = '';

  // Overview
  if (d.overview) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Sinopsis</div>
      <div class="detail-overview">${esc(d.overview)}</div>
    </div>`;
  }

  // Tagline
  if (d.tagline) {
    html += `<div style="margin-bottom:24px;padding:14px 18px;border-left:3px solid var(--silver-d);background:var(--bg-card);border-radius:0 var(--r) var(--r) 0">
      <div style="font-size:14px;font-style:italic;color:var(--text-m)">"${esc(d.tagline)}"</div>
    </div>`;
  }

  // Info row
  const infoItems = [];
  if (d.directors?.length) infoItems.push(['Sutradara', d.directors.join(', ')]);
  if (d.creators?.length)  infoItems.push(['Kreator', d.creators.join(', ')]);
  if (d.episodes_count)    infoItems.push(['Jumlah Episode', d.episodes_count]);
  if (d.runtime)           infoItems.push(['Durasi', `${d.runtime} menit`]);

  if (infoItems.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Informasi</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px">
        ${infoItems.map(([k,v]) => `
          <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--r);padding:12px">
            <div style="font-size:11px;color:var(--text-d);margin-bottom:4px">${esc(k)}</div>
            <div style="font-size:13px;font-weight:600;color:var(--text)">${esc(v)}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // Cast
  if (d.cast?.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">Pemeran Utama</div>
      <div class="cast-row">
        ${d.cast.map(c => `
          <div class="cast-card">
            <div class="cast-photo">
              ${c.photo
                ? `<img src="${esc(c.photo)}" alt="${esc(c.name)}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
                : `<div style="width:100%;height:100%;display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" opacity=".3"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/></svg></div>`}
            </div>
            <div class="cast-name">${esc(c.name)}</div>
            <div class="cast-char">${esc(c.character || '')}</div>
          </div>`).join('')}
      </div>
    </div>`;
  }

  // Episodes (TV)
  if (apiType === 'tv' && d.seasons?.length) {
    const season = d.seasons.find(s => s.season_number === curSeason) || d.seasons[0];
    html += `<div class="detail-section" id="episodesSection">
      <div class="detail-section-title">Episode</div>
      <div class="season-sel" id="seasonSel">
        ${d.seasons.map(s => `
          <button class="season-btn ${s.season_number === curSeason ? 'active' : ''}"
            onclick="switchSeason(${s.season_number})">
            Season ${s.season_number}
          </button>`).join('')}
      </div>
      <div class="ep-list" id="epList">
        ${renderEpisodes(season.episodes, d.id)}
      </div>
    </div>`;
  }

  // Similar
  if (d.similar?.length) {
    html += `<div class="detail-section">
      <div class="detail-section-title">${apiType === 'tv' ? 'Series Serupa' : 'Film Serupa'}</div>
      <div class="h-scroll">
        ${d.similar.map(cardHTML).join('')}
      </div>
    </div>`;
  }

  document.getElementById('detailBody').innerHTML = html;

  // Attach season switch
  window.switchSeason = function(n) {
    curSeason = n;
    const season = detail.seasons.find(s => s.season_number === n);
    document.getElementById('epList').innerHTML = renderEpisodes(season?.episodes || [], detail.id);
    document.querySelectorAll('.season-btn').forEach(btn => {
      btn.classList.toggle('active', +btn.textContent.replace('Season ','') === n);
    });
  };
}

function renderEpisodes(episodes, showId) {
  if (!episodes?.length) return '<div class="state-msg">Tidak ada episode</div>';
  return episodes.map(ep => {
    const url = `/player?id=${showId}&type=series&season=${ep.stream.split('/').slice(-2)[0]}&episode=${ep.episode_number}&title=${encodeURIComponent(ep.name || `Episode ${ep.episode_number}`)}`;
    return `<a class="ep-item" href="${url}">
      <div class="ep-still">
        ${ep.still
          ? `<img src="${esc(ep.still)}" alt="ep${ep.episode_number}" referrerpolicy="no-referrer" onerror="this.style.display='none'">`
          : ''}
      </div>
      <div class="ep-info">
        <div class="ep-num">Episode ${ep.episode_number}${ep.rating ? ` · ★ ${ep.rating}` : ''}${ep.air_date ? ` · ${ep.air_date}` : ''}</div>
        <div class="ep-title">${esc(ep.name || `Episode ${ep.episode_number}`)}</div>
        ${ep.overview ? `<div class="ep-overview">${esc(ep.overview)}</div>` : ''}
      </div>
      <div class="ep-play">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21"/></svg>
      </div>
    </a>`;
  }).join('');
}

function doShare(shareUrl) {
  const full = location.origin + shareUrl;
  if (navigator.share) {
    navigator.share({ title: detail?.title, url: full }).catch(() => {});
  } else {
    navigator.clipboard.writeText(full).then(() => nwToast('Link disalin!'));
  }
}

load();
</script>
</body>
</html>
